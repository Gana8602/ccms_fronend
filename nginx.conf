server {
    listen 8767;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve Angular app files, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:6787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Handle static files for Django Admin if needed (optional)
    location /static/ {
        proxy_pass http://backend:6787/static/;
    }
    
    # Handle media files from Django if needed
    location /media/ {
        proxy_pass http://backend:6787/media/;
    }

    # Proxy live video feeds
    location /video_feed/ {
        proxy_pass http://backend:6787/video_feed/;
    }
}
