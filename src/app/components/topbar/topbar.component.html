<div class="flex items-center justify-between w-full h-full text-brand-text">
  
  <div class="flex flex-col">
    <h1 class="text-lg 2xl:text-xl font-display font-bold tracking-wider flex items-center gap-3 text-primary">
      SABARIMALA SMART CROWD MANAGEMENT SYSTEM
    </h1>
    <div class="text-[9px] 2xl:text-[10px] text-primary-blue font-bold tracking-[0.2em] uppercase mt-1">
      REAL-TIME MONITORING &bull; AI ANALYTICS &bull; SAFE PILGRIMAGE
    </div>
  </div>

  <div class="flex items-center gap-4 2xl:gap-6">
    
    <!-- Time & Weather -->
    <div class="flex items-center gap-3 2xl:gap-4 px-3 2xl:px-4 py-1.5 2xl:py-2">
      <div class="flex items-center gap-2 text-[11px] 2xl:text-xs font-semibold">
        <i class="pi pi-calendar text-muted"></i>
        {{ currentTime() | date:'dd MMM yyyy' }}
      </div>
      <div class="w-px h-4 bg-slate-300 dark:bg-slate-700"></div>
      <div class="flex items-center gap-2 text-[11px] 2xl:text-xs font-semibold w-20 2xl:w-24">
        <i class="pi pi-clock text-muted"></i>
        {{ currentTime() | date:'HH:mm:ss' }}
      </div>
      <div class="w-px h-4 bg-slate-300 dark:bg-slate-700"></div>
      <div class="flex items-center gap-2 text-[11px] 2xl:text-xs font-bold text-primary-blue">
        <i class="pi pi-cloud text-base 2xl:text-lg"></i>
        <div class="flex flex-col leading-none">
          <span class="text-primary">24°C</span>
          <span class="text-[8px] 2xl:text-[9px] text-muted font-normal">Light Rain</span>
        </div>
      </div>
    </div>

    <!-- Status Icons -->
    <div class="flex items-center gap-3 2xl:gap-4">
      <button class="text-muted hover:text-primary transition-colors relative" title="Network Status">
        <i class="pi pi-wifi text-base 2xl:text-lg"></i>
      </button>
      <button class="text-muted hover:text-primary transition-colors relative" title="Notifications">
        <i class="pi pi-bell text-base 2xl:text-lg"></i>
        <span class="absolute -top-1.5 -right-1.5 bg-status-red text-white text-[8px] font-bold px-1 rounded-full">5</span>
      </button>
    </div>

    <div class="w-px h-8 bg-slate-300 dark:bg-slate-700 hidden 2xl:block"></div>

    <!-- Actions -->
    <div class="flex items-center gap-2 2xl:gap-3">
      <button (click)="toggleTheme()" class="w-7 h-7 2xl:w-8 2xl:h-8 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-muted" [title]="isDarkMode() ? 'Light Mode' : 'Dark Mode'">
        <i class="pi text-sm" [class.pi-sun]="isDarkMode()" [class.pi-moon]="!isDarkMode()"></i>
      </button>
      <button (click)="toggleFullscreen()" class="w-7 h-7 2xl:w-8 2xl:h-8 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-muted" title="Fullscreen">
        <i class="pi pi-window-maximize text-sm"></i>
      </button>
      
      <!-- User Profile -->
      <button class="flex items-center gap-2 hover:bg-slate-100 dark:hover:bg-slate-800 pl-1 pr-2 2xl:pr-3 py-1 rounded-full transition-colors ml-1 2xl:ml-2">
        <img src="https://ui-avatars.com/api/?name=Admin&background=1976d2&color=fff&rounded=true" alt="Admin" class="w-6 h-6 2xl:w-7 2xl:h-7 rounded-full">
        <span class="text-[11px] 2xl:text-xs font-semibold">Admin</span>
        <i class="pi pi-angle-down text-[9px] 2xl:text-[10px] text-muted"></i>
      </button>
    </div>

  </div>
</div>
